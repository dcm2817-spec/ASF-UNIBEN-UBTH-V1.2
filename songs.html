<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Songs — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Songs — ASF Uniben/UBTH">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav data-nav-menu></nav>
  </header>

  <div class="container" style="max-width:640px;">
    <h1>Songs</h1>
    <p class="hint">The fellowship's song list, maintained by AMM.</p>

    <div id="manage-section" style="display:none;">
      <form id="song-form" class="card" style="margin-top:1rem;">
        <div class="field">
          <label for="song-title">Title</label>
          <input id="song-title" placeholder="Song title" required>
        </div>
        <div class="field">
          <label for="song-reference">Reference (optional)</label>
          <input id="song-reference" placeholder="e.g. hymn number, artist">
        </div>
        <button class="btn btn-solid" type="submit">Add Song</button>
      </form>
    </div>

    <div id="songs-list" style="margin-top:1.5rem;">
      <div class="skeleton" style="height:3rem;"></div>
      <div class="skeleton" style="height:3rem;"></div>
    </div>
  </div>

  <footer data-auto-footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="protect.js"></script>
  <script src="nav-links.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script src="toast.js"></script>
  <script src="songs.js"></script>
</body>
</html>

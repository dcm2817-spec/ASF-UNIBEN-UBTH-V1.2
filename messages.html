<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Messages — ASF Uniben/UBTH">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
  <style>
    .message-meta { font-size: 0.78rem; color: rgba(36,20,18,0.55); margin: 0.3rem 0 0; }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav data-nav-menu></nav>
  </header>

  <div class="container" style="max-width:640px;">
    <h1>Messages</h1>

    <div id="send-section" style="display:none;">
      <h2 style="margin-top:1.5rem;">📤 Send Message</h2>
      <form id="send-form" class="card">
        <div class="field" id="target-field">
          <label for="target-type">Send to</label>
          <select id="target-type">
            <option value="all">All Members</option>
            <option value="group">A specific group</option>
          </select>
        </div>
        <div class="field" id="group-field" style="display:none;">
          <label for="group-name" id="group-label">Group</label>
          <input id="group-name" placeholder="Exact ministry group or hall name">
        </div>
        <div class="field">
          <label for="message-content">Message</label>
          <textarea id="message-content" rows="3" placeholder="e.g. Group meeting by 6pm"></textarea>
        </div>
        <button class="btn btn-solid" type="submit">Send</button>
      </form>
    </div>

    <h2 style="margin-top:2rem;">📥 Message List</h2>
    <div id="messages-list" style="margin-top:1rem;">
      <div class="skeleton" style="height:3.5rem;"></div>
      <div class="skeleton" style="height:3.5rem;"></div>
    </div>
  </div>

  <footer data-auto-footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="protect.js"></script>
  <script src="nav-links.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script src="toast.js"></script>
  <script src="pull-to-refresh.js"></script>
  <script src="messages.js"></script>
</body>
</html>

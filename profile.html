<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Anglican Students' Fellowship — UNIBEN/UBTH">
  <meta property="og:description" content="Arise, Shine! Christian fellowship for students of Uniben and UBTH.">
  <meta property="og:image" content="https://YOUR-DOMAIN-HERE/logo.png">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav data-nav-menu></nav>
  </header>

  <div class="container-narrow">
    <h1>My Profile</h1>
    <p class="hint">Update your own details below.</p>

    <div id="streak-slot" style="margin-bottom:1rem;"></div>

    <form id="profile-form">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" required>
      </div>
      <div class="field field-row">
        <div>
          <label for="department">Department</label>
          <input id="department" required>
        </div>
        <div>
          <label for="level">Level</label>
          <select id="level" required>
            <option>100</option><option>200</option><option>300</option>
            <option>400</option><option>500</option><option>600</option>
            <option>Postgraduate</option><option>Part-time</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Date of birth (day &amp; month only)</label>
        <div class="field-row">
          <select id="dob-day" required>
            <option value="" disabled selected>Day</option>
          </select>
          <select id="dob-month" required>
            <option value="" disabled selected>Month</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input id="location" required>
      </div>
      <div class="field">
        <label for="ministryGroup">Ministry group</label>
        <select id="ministryGroup" required></select>
      </div>
      <div class="field">
        <label for="ministryGroup2">Second ministry group (optional -- max 2)</label>
        <select id="ministryGroup2"><option value="">None</option></select>
      </div>
      <p class="error-text" id="profile-error" style="display:none;"></p>
      <p class="hint" id="profile-success" style="display:none; color:#166534;"></p>
      <button class="btn btn-solid" type="submit" style="width:100%; padding:0.65rem;">Save changes</button>
    </form>

    <button class="btn btn-outline" id="member-card-btn" style="width:100%; margin-top:1rem; border-color:var(--oxblood); color:var(--oxblood);">🪪 Download My Member Card</button>
    <canvas id="member-card-canvas" width="640" height="360" style="display:none;"></canvas>
  </div>

  <footer data-auto-footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="protect.js"></script>
  <script src="ministry-groups-data.js"></script>
  <script src="nav-links.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script src="toast.js"></script>
  <script src="profile.js"></script>
</body>
</html>

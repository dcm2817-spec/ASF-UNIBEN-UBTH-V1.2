<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ASF Uniben/UBTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Dashboard — ASF Uniben/UBTH">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
  <style>
    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem;
    }
    .stat-card { text-align: center; }
    .stat-number {
      font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; color: var(--oxblood); margin: 0;
    }
    .stat-label { color: rgba(36,20,18,0.6); font-size: 0.85rem; margin: 0.2rem 0 0; }
    .inactive-row {
      display: flex; justify-content: space-between; padding: 0.5rem 0;
      border-bottom: 1px solid rgba(122,29,29,0.08);
    }
    .inactive-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ASF logo"> ASF</a>
    <nav data-nav-menu></nav>
  </header>

  <div class="container">
    <h1>Dashboard</h1>
    <p class="hint" id="scope-label">Loading&hellip;</p>

    <div class="stat-grid">
      <div class="card stat-card">
        <p class="stat-number" id="stat-total">--</p>
        <p class="stat-label">Total Members</p>
      </div>
      <div class="card stat-card">
        <p class="stat-number" id="stat-today">--</p>
        <p class="stat-label">Attendance Today</p>
      </div>
      <div class="card stat-card" style="grid-column: span 2;">
        <p class="stat-number" id="stat-inactive">--</p>
        <p class="stat-label">Inactive Members (below 50%)</p>
      </div>
    </div>

    <h2 style="margin-top:2rem;">Top 5 Inactive</h2>
    <div class="card" id="inactive-list" style="margin-top:0.75rem;">
      <p class="hint">Loading&hellip;</p>
    </div>

    <p style="margin-top:1.5rem;">
      <a href="my-group.html" class="hint">View flagged members in my group &rarr;</a>
      &nbsp;&middot;&nbsp;
      <a href="follow-ups.html" class="hint">View Follow-Ups &rarr;</a>
    </p>
  </div>

  <footer data-auto-footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>window.REQUIRE_ROLES = ['leader', 'admin'];</script>
  <script src="protect.js"></script>
  <script src="nav-links.js"></script>
  <script src="nav.js"></script>
  <script src="nav-hide.js"></script>
  <script src="toast.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
